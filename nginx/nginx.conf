user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version in response headers:
    server_tokens off;

    # Log upstream IP ($upstream_addr) and response time ($upstream_response_time) for 502/504 debugging:
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'ups_addr="$upstream_addr" ups_time="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Allow large freight tariff files up to 50MB (prevents 413 Request Entity Too Large):
    client_max_body_size 50m;

    upstream backend_api {
        server 10.42.0.15:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "OK\n";
        }

        location /v1/ {
            # No trailing slash — preserves /v1/ prefix when forwarding to backend:
            proxy_pass http://backend_api;

            # Enable HTTP/1.1 keepalive to upstream:
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward client IP and protocol info:
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts:
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Increased header buffers for large JWT tokens (prevents 502 upstream sent too big header):
            proxy_buffer_size          16k;
            proxy_buffers              4 32k;
            proxy_busy_buffers_size    64k;
        }
    }
}
