replicaCount: 2

image:
  repository: registry.gitlab.com/velofreight/tariff-api
  pullPolicy: IfNotPresent
  tag: "1.14.2"

service:
  type: ClusterIP
  port: 80
  containerPort: 8000

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 512Mi

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

pdb:
  enabled: true
  minAvailable: 1
